<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 1400" role="img" aria-label="Agda">
  <!--
    Favicon adaptation of Agda's official mark from
    doc/user-manual/agda.svg. The geometry and aspect ratio are unchanged;
    the square safe area and heavier stroke keep it legible at 16 px.
  -->
  <rect width="1400" height="1400" rx="180" fill="#f7f8f5"/>
  <g
    transform="translate(100 200)"
    fill="none"
    stroke="#171916"
    stroke-width="72"
    stroke-linecap="round"
    stroke-linejoin="round"
  >
    <path d="M1000 0 600 400"/>
    <path d="m1200 100-200 200"/>
    <path d="m1200 0-200 200"/>
    <path d="M500 0 300 200"/>
    <path d="M600 0 400 200"/>
    <path d="M400 0 0 400h200v200c0 220 180 400 400 400s400-180 400-400V400l200-200"/>
  </g>
  <g transform="translate(100 200)" fill="#171916">
    <circle cx="240" cy="270" r="40"/>
    <circle cx="340" cy="270" r="40"/>
  </g>
</svg>
